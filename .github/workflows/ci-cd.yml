name: HomeServer CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  BACKEND_IMAGE: ghcr.io/aswina1636/home-server-backend
  FRONTEND_IMAGE: ghcr.io/aswina1636/home-server-frontend

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q backend

  frontend-build:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs:
      - test
      - frontend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Backend Image
        run: |
          set -euo pipefail
          docker build \
            -f Dockerfile.backend \
            -t "$BACKEND_IMAGE:latest" \
            -t "$BACKEND_IMAGE:${GITHUB_SHA}" \
            .

      - name: Build Frontend Image
        run: |
          set -euo pipefail
          docker build \
            -f Dockerfile.frontend \
            -t "$FRONTEND_IMAGE:latest" \
            -t "$FRONTEND_IMAGE:${GITHUB_SHA}" \
            .

      - name: Push Backend Images
        run: |
          set -euo pipefail
          docker push "$BACKEND_IMAGE:latest"
          docker push "$BACKEND_IMAGE:${GITHUB_SHA}"

      - name: Push Frontend Images
        run: |
          set -euo pipefail
          docker push "$FRONTEND_IMAGE:latest"
          docker push "$FRONTEND_IMAGE:${GITHUB_SHA}"

  deploy:
    name: Deploy HomeServer
    runs-on: [self-hosted, Linux, X64, homeserver]
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Configure Docker Desktop
        shell: bash
        run: |
          set -euo pipefail

          test -S "$HOME/.docker/desktop/docker.sock"
          test -d "$HOME/.docker/contexts"

          DOCKER_CONFIG_DIR="$RUNNER_TEMP/docker-config-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$DOCKER_CONFIG_DIR"
          chmod 700 "$DOCKER_CONFIG_DIR"
          cp -a "$HOME/.docker/contexts" "$DOCKER_CONFIG_DIR/contexts"

          echo "DOCKER_CONFIG=$DOCKER_CONFIG_DIR" >> "$GITHUB_ENV"
          echo "DOCKER_HOST=unix://$HOME/.docker/desktop/docker.sock" >> "$GITHUB_ENV"

          docker info
          docker compose version

      - name: Login to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail

          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io \
              --username "$GHCR_USER" \
              --password-stdin

      - name: Verify Production Data
        shell: bash
        run: |
          set -euo pipefail

          mountpoint -q /data
          test -d /data/homeserver-data
          test -f /data/homeserver-data/homeserver.db

          echo "Production database exists on mounted HDD."

      - name: Pull Published Images
        shell: bash
        run: |
          set -euo pipefail
          cd "$HOME/homeserver"

          docker compose -p homeserver pull

      - name: Backup SQLite Database
        shell: bash
        run: |
          set -euo pipefail

          DATA_DIR="/data/homeserver-data"
          BACKUP_DIR="/data/homeserver-backups"
          TIMESTAMP="$(date +'%Y%m%d-%H%M%S')"
          BACKUP_FILE="$BACKUP_DIR/homeserver-$TIMESTAMP.db"

          mountpoint -q /data
          test -f "$DATA_DIR/homeserver.db"
          mkdir -p "$BACKUP_DIR"

          python3 - "$DATA_DIR/homeserver.db" "$BACKUP_FILE" <<'PY'
          import os
          import sqlite3
          import sys

          source, destination = sys.argv[1:3]
          src = sqlite3.connect(source, timeout=30)
          dst = sqlite3.connect(destination)

          try:
              src.backup(dst)
              result = dst.execute("PRAGMA integrity_check").fetchone()[0]
              if result != "ok":
                  raise RuntimeError(f"Backup integrity check failed: {result}")
          finally:
              dst.close()
              src.close()

          os.chmod(destination, 0o600)
          print(f"Verified SQLite backup: {destination}")
          PY

      - name: Record Previous Images
        id: previous
        shell: bash
        run: |
          set -euo pipefail

          BACKEND_ID="$(docker inspect --format='{{.Image}}' homeserver-backend)"
          FRONTEND_ID="$(docker inspect --format='{{.Image}}' homeserver-frontend)"

          echo "backend=$BACKEND_ID" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy New Containers
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          cd "$HOME/homeserver"

          # Explicit project name limits Compose operations to the primary server.
          docker compose -p homeserver up -d

      - name: Health Check
        id: health
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              --max-time 5 \
              http://localhost:8000/api/connection-info >/dev/null; then
              echo "HomeServer health check passed."
              exit 0
            fi

            echo "Health check attempt $attempt/30 failed."
            sleep 2
          done

          echo "ERROR: HomeServer health check failed."
          exit 1

      - name: Show Deployment Status
        if: success()
        shell: bash
        run: |
          cd "$HOME/homeserver"
          docker compose -p homeserver ps

      - name: Roll Back After Deployment Failure
        if: failure() && steps.previous.outcome == 'success' && steps.deploy.outcome != 'skipped'
        shell: bash
        env:
          PREVIOUS_BACKEND_ID: ${{ steps.previous.outputs.backend }}
          PREVIOUS_FRONTEND_ID: ${{ steps.previous.outputs.frontend }}
        run: |
          set -euo pipefail
          cd "$HOME/homeserver"

          docker tag "$PREVIOUS_BACKEND_ID" "$BACKEND_IMAGE:rollback"
          docker tag "$PREVIOUS_FRONTEND_ID" "$FRONTEND_IMAGE:rollback"

          OVERRIDE_FILE="$(mktemp)"
          trap 'rm -f "$OVERRIDE_FILE"' EXIT

          cat > "$OVERRIDE_FILE" <<'YAML'
          services:
            backend:
              image: ghcr.io/aswina1636/home-server-backend:rollback
            frontend:
              image: ghcr.io/aswina1636/home-server-frontend:rollback
          YAML

          docker compose \
            -p homeserver \
            -f docker-compose.yml \
            -f "$OVERRIDE_FILE" \
            up -d

          echo "Previous application images restored."

          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              --max-time 5 \
              http://localhost:8000/api/connection-info >/dev/null; then
              echo "Rollback health check passed."
              cd "$HOME/homeserver"
              docker compose -p homeserver ps
              exit 0
            fi
            sleep 2
          done

          echo "ERROR: Rollback completed but health check failed."
          docker --context desktop-linux logs --tail 80 homeserver-backend || true
          docker --context desktop-linux logs --tail 80 homeserver-frontend || true
          exit 1

      - name: Remove Temporary Docker Credentials
        if: always()
        shell: bash
        run: |
          if [ -n "${DOCKER_CONFIG:-}" ] && \
             [[ "$DOCKER_CONFIG" == "$RUNNER_TEMP"/docker-config-* ]]; then
            rm -rf -- "$DOCKER_CONFIG"
          fi