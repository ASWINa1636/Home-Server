name: HomeServer CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/aswina1636/home-server-backend
  FRONTEND_IMAGE: ghcr.io/aswina1636/home-server-frontend

jobs:

  # ============================================================
  # CI
  # ============================================================

  test:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Python syntax check
        run: |
          python -m compileall backend

  # ============================================================
  # FRONTEND BUILD
  # ============================================================

  frontend-build:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # ============================================================
  # DOCKER BUILD + GHCR
  # ============================================================

  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    needs:
      - test
      - frontend-build

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build \
            -f Dockerfile.backend \
            -t $BACKEND_IMAGE:latest \
            -t $BACKEND_IMAGE:${{ github.sha }} \
            .

      - name: Build frontend image
        run: |
          docker build \
            -f Dockerfile.frontend \
            -t $FRONTEND_IMAGE:latest \
            -t $FRONTEND_IMAGE:${{ github.sha }} \
            .

      - name: Push backend image
        run: |
          docker push $BACKEND_IMAGE:latest
          docker push $BACKEND_IMAGE:${{ github.sha }}

      - name: Push frontend image
        run: |
          docker push $FRONTEND_IMAGE:latest
          docker push $FRONTEND_IMAGE:${{ github.sha }}

  # ============================================================
  # DEPLOY TO HOMESERVER
  # ============================================================

  deploy:
    name: Deploy HomeServer
    runs-on: self-hosted

    needs:
      - docker

    steps:

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Pull latest images
        run: |
          cd ~/homeserver
          docker compose pull

      - name: Backup HomeServer data
        run: |
          BACKUP_DIR="/data/homeserver-backups"
          TIMESTAMP=$(date +"%Y%m%d-%H%M%S")

          mkdir -p "$BACKUP_DIR"

          if [ -f "/data/homeserver-data/homeserver.db" ]; then
            cp "/data/homeserver-data/homeserver.db" \
               "$BACKUP_DIR/homeserver-$TIMESTAMP.db"
          fi

      - name: Deploy containers
        run: |
          cd ~/homeserver
          docker compose up -d --remove-orphans

      - name: Wait for application
        run: |
          sleep 10

      - name: Health check
        run: |
          curl --fail --silent --show-error \
            http://localhost:8000/api/connection-info

      - name: Show container status
        run: |
          cd ~/homeserver
          docker compose ps
